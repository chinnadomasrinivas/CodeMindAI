<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>CodeMind AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#0b0d14;--card:#12151f;--card2:#171b28;--bd:#252a3b;--tx:#e6e9f2;--mu:#8b93a9;--ac:#7c6cff;--ac2:#4c8dff;--cr:#ff5d6c;--wa:#f5b83d;--su:#4c8dff;--ok:#38d39f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{border-right:1px solid var(--bd);padding:18px 12px;position:sticky;top:0;height:100vh;background:#0e1019}
.logo{display:flex;gap:10px;align-items:center;font-weight:700;font-size:16px;padding:0 8px 18px}
.logo i{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-style:normal;font-size:13px;font-family:monospace}
nav a{display:flex;gap:10px;padding:9px 12px;border-radius:9px;color:var(--mu);text-decoration:none;margin-bottom:2px;transition:.15s}
nav a:hover{background:var(--card);color:var(--tx)}nav a.on{background:linear-gradient(90deg,#7c6cff33,#4c8dff11);color:#fff;box-shadow:inset 2px 0 var(--ac)}
main{min-width:0}
header{display:flex;gap:12px;align-items:center;padding:12px 24px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:#0b0d14ee;backdrop-filter:blur(8px);z-index:5}
header input{flex:1;max-width:380px;background:var(--card);border:1px solid var(--bd);border-radius:9px;padding:8px 12px}
.av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-weight:600;font-size:12px}
.pg{padding:24px;max-width:1150px;margin:auto;animation:fi .3s}@keyframes fi{from{opacity:0;transform:translateY(6px)}}
h1{font-size:24px;margin:0 0 4px}h2{font-size:16px;margin:0 0 12px}.mu{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;transition:.2s}
.card.h:hover{border-color:#4a4f7a;transform:translateY(-2px)}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1.4fr 1fr}.g3{grid-template-columns:repeat(2,1fr)}
.hero{background:radial-gradient(600px 200px at 90% 0,#7c6cff40,transparent),var(--card);border:1px solid var(--bd);border-radius:16px;padding:28px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.btn{background:linear-gradient(135deg,var(--ac),var(--ac2));border:0;border-radius:9px;padding:9px 16px;font-weight:600;cursor:pointer;color:#fff;transition:.15s}.btn:hover{filter:brightness(1.15)}
.btn.g{background:var(--card2);border:1px solid var(--bd);color:var(--tx)}
.stat b{font-size:28px;display:block}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:6px;background:#7c6cff22;color:#a99dff;display:inline-block}
.CRITICAL{background:#ff5d6c22;color:var(--cr)}.WARNING{background:#f5b83d22;color:var(--wa)}.SUGGESTION{background:#4c8dff22;color:var(--su)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.ed{display:flex;background:#0a0c12;border:1px solid var(--bd);border-radius:12px;overflow:hidden;font:13px/1.6 "JetBrains Mono",ui-monospace,Menlo,monospace;height:260px}
.ln{padding:12px 10px;color:#4b5270;text-align:right;user-select:none;white-space:pre;background:#0d0f17}
.cw{position:relative;flex:1;overflow:auto}
.cw pre,.cw textarea{margin:0;padding:12px;font:inherit;white-space:pre;position:absolute;inset:0;overflow:hidden;border:0;background:none;width:100%;height:100%;resize:none;outline:0}
.cw textarea{color:transparent;caret-color:#fff;overflow:auto;z-index:2}
.k{color:#c792ff}.s{color:#7ee0a8}.c{color:#5d6690}
.code{font:13px ui-monospace,Menlo,monospace;background:#0a0c12;border:1px solid var(--bd);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre;margin:8px 0}
.mm{position:relative;border-radius:16px;padding:1.5px;background:linear-gradient(135deg,#7c6cff,#4c8dff,#38d39f);margin:16px 0;box-shadow:0 0 40px #7c6cff33;animation:gl 3s infinite alternate}
@keyframes gl{to{box-shadow:0 0 60px #4c8dff55}}
.mm>div{background:linear-gradient(160deg,#171533,#0f1524);border-radius:15px;padding:20px}
.q{border-left:3px solid var(--ac);padding:6px 14px;background:#7c6cff14;border-radius:0 8px 8px 0;margin:8px 0;font-style:italic}
.ag li{list-style:none;padding:6px 0;color:var(--mu);display:flex;gap:10px;transition:.3s}.ag li.d{color:var(--tx)}.ag li.d:before{content:"✓";color:var(--ok)}.ag li:not(.d):before{content:"◌";animation:sp 1s infinite}
@keyframes sp{50%{opacity:.2}}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:14px 0}.tabs button{background:none;border:1px solid var(--bd);border-radius:20px;padding:6px 14px;color:var(--mu);cursor:pointer;white-space:nowrap}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.sw{width:38px;height:22px;border-radius:11px;background:var(--bd);border:0;position:relative;cursor:pointer;flex:none}.sw:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--ac)}.sw.on:after{left:19px}
.ov{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:20;padding:16px}.md{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px;width:100%;max-width:440px}
label{display:block;margin:10px 0 4px;color:var(--mu);font-size:12px}
.in{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--mu);font-weight:500;padding:8px}td{padding:11px 8px;border-top:1px solid var(--bd)}tr.cl{cursor:pointer}tr.cl:hover{background:var(--card2)}
.tw{overflow-x:auto}.ok{color:var(--ok)}.wa{color:var(--wa)}
@media(max-width:820px){.app{grid-template-columns:1fr}aside{position:static;height:auto;display:flex;flex-direction:column;padding:8px}nav{display:flex;overflow-x:auto}nav a{white-space:nowrap}.logo{padding-bottom:8px}.g4{grid-template-columns:1fr 1fr}.g2,.g3{grid-template-columns:1fr}.pg{padding:14px}header{padding:10px 14px}}
</style></head><body>
<div class="app"><aside><div class="logo"><i>{◉}</i>CodeMind AI</div><nav id="nav"></nav></aside>
<main><header><input placeholder="Search reviews, rules, memory…"><span style="flex:1"></span><span title="Notifications">🔔</span><div class="av">SR</div></header><div id="v"></div></main></div>
<div id="m"></div>
<script>
const $=s=>document.querySelector(s);
const rules=[["Use parameterized SQL queries",1],["Never hard-code API keys",1],["Use async/await",1],["Use centralized error handling",1],["Avoid duplicate database calls",1],["Use meaningful variable names",1],["Follow repository pattern",1],["Validate all user input",1],["Log errors with request context",1],["Keep functions under 40 lines",0],["Write unit tests for services",1],["No secrets in logs",1]].map(([t,e],i)=>({id:i,t,e}));
const MT=["Team Rule","Previous Review","Architecture Decision","Common Mistake"];
const D={"Team Rule":"Standard enforced across all pull requests.","Previous Review":"Decision captured from a past review discussion.","Architecture Decision":"Agreed design direction for the codebase.","Common Mistake":"Recurring issue pattern detected by the agent."};
let mem=[["Team Rule","Use parameterized SQL queries","PR #18","Sep 18, 2026",14],["Architecture Decision","Use centralized error handling","PR #23","Sep 20, 2026",9],["Team Rule","Never hard-code API keys","PR #12","Sep 05, 2026",11],["Previous Review","Repository pattern for user data access","PR #31","Sep 22, 2026",6],["Common Mistake","String-concatenated SQL queries","PR #18","Sep 18, 2026",8],["Common Mistake","Missing await on async DB calls","PR #27","Sep 14, 2026",5],["Architecture Decision","Service layer owns business logic","PR #9","Aug 30, 2026",7],["Team Rule","Use async/await over callbacks","PR #14","Sep 08, 2026",10],["Previous Review","Avoid N+1 queries in list endpoints","PR #35","Sep 24, 2026",4],["Common Mistake","Swallowed exceptions with bare except","PR #21","Sep 12, 2026",6],["Architecture Decision","Use Redis for session caching","PR #29","Sep 16, 2026",3],["Team Rule","Validate all user input","PR #16","Sep 09, 2026",9],["Previous Review","Rotate tokens via secrets manager","PR #33","Sep 23, 2026",2],["Common Mistake","Duplicate database calls in loops","PR #26","Sep 13, 2026",5],["Architecture Decision","REST error envelope format","PR #19","Sep 10, 2026",6],["Team Rule","Meaningful variable names","PR #7","Aug 28, 2026",8],["Previous Review","Extract payment retries into helper","PR #38","Sep 25, 2026",2],["Common Mistake","Logging sensitive user data","PR #30","Sep 17, 2026",4],["Architecture Decision","Feature flags for risky rollouts","PR #37","Sep 25, 2026",1],["Previous Review","Prefer dependency injection in services","PR #40","Sep 26, 2026",3]].map((a,i)=>({id:i,type:a[0],t:a[1],src:a[2],date:a[3],use:a[4],d:D[a[0]]}));
let revs=[[42,"User Service","Python",5,"Needs Changes","Today",2],[41,"Payment API","JavaScript",2,"Approved with Suggestions","Yesterday",0],[40,"User Service","Python",4,"Needs Changes","Sep 26",1],[39,"Auth Gateway","TypeScript",3,"Needs Changes","Sep 25",1],[38,"Payment API","JavaScript",1,"Approved","Sep 25",0],[37,"Notifications","Python",6,"Needs Changes","Sep 24",3],[35,"Orders API","Go",2,"Approved with Suggestions","Sep 24",0],[33,"Auth Service","Python",4,"Needs Changes","Sep 23",1],[31,"User Repository","TypeScript",2,"Approved with Suggestions","Sep 22",0],[23,"Error Middleware","JavaScript",1,"Approved","Sep 20",0]].map(a=>({id:a[0],repo:a[1],lang:a[2],n:a[3],st:a[4],date:a[5],cr:a[6]}));
let code='def get_user(user_id):\n    query = "SELECT * FROM users WHERE id=" + user_id\n    return database.execute(query)\n';
let modal=null,tab="All Memory",loading=0,saved=false,steps=["Analyzing code","Checking security","Searching team memory","Comparing previous reviews","Generating recommendations"];
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const hl=s=>esc(s).replace(/(#.*$)|("[^"]*"|'[^']*')|\b(def|return|import|from|class|if|else|for|in|async|await|const|let|function)\b/gm,(m,c,st,k)=>c?`<span class=c>${m}</span>`:st?`<span class=s>${m}</span>`:`<span class=k>${m}</span>`);
const NAV=[["dashboard","▦","Dashboard"],["review","</>","Code Review"],["memory","◉","Agent Memory"],["history","↺","Review History"],["rules","✓","Team Rules"],["settings","⚙","Settings"]];
const stat=(l,v)=>`<div class="card stat h"><span class=mu>${l}</span><b>${v}</b></div>`;
const rowRev=r=>`<div class=row style="cursor:pointer" onclick="location.hash='#/review/${r.id}'"><div><b>PR #${r.id} — ${r.repo}</b><div class=mu>${r.n} issues${r.cr?` · <span style="color:var(--cr)">${r.cr} critical</span>`:""}</div></div><span class=mu>${r.date}</span></div>`;
const stC=s=>s=="Needs Changes"?"wa":"ok";
function memCard(m){return `<div class="card h"><span class=tag>${m.type.toUpperCase()}</span><h2 style="margin:10px 0 4px">${m.t}</h2><p class=mu style="margin:0 0 10px">${m.d}</p><div class=mu style="font-size:12px">Source: ${m.src} · Created: ${m.date} · Used ${m.use} times</div></div>`}
function issue(sev,t,line,cd,why,fix){return `<div class=card style="margin-bottom:12px;border-left:3px solid var(--${sev=="CRITICAL"?"cr":sev=="WARNING"?"wa":"su"})"><span class="tag ${sev}">${sev}</span> <b style="margin-left:6px">${t}</b><div class=mu style="margin:4px 0">Line ${line}</div>${cd?`<div class=code>${esc(cd)}</div>`:""}<p><b>Why it matters:</b> <span class=mu>${why}</span></p><p style="margin:0"><b>Suggested fix:</b> <span class=mu>${fix}</span></p></div>`}
const P={
dashboard(){return `<div class=hero><div><h1>Your team's AI code reviewer</h1><span class=mu>Review code with the context of your team's past decisions.</span></div><button class=btn onclick="location.hash='#/review'">+ New Code Review</button></div>
<div class="grid g4">${stat("Total Reviews",revs.length+38)}${stat("Issues Found",revs.reduce((a,r)=>a+r.n,0)+96)}${stat("Memory Items",mem.length+136)}${stat("Team Rules",rules.length)}</div>
<div class="grid g2" style="margin-top:14px"><div class=card><h2>Recent Reviews</h2>${revs.slice(0,3).map(rowRev).join("")}</div>
<div class=card style="background:linear-gradient(160deg,#1b1840,var(--card))"><h2>Memory Insights</h2><div class=row><span>Memory items</span><b>${mem.length+136}</b></div><div class=row><span>Team rules</span><b>${rules.length}</b></div><div class=row><span>Recurring issue patterns</span><b>8</b></div></div></div>`},
review(){if(loading)return `<div class=card style="max-width:480px;margin:40px auto"><h2>Code Review Agent</h2><ul class=ag style="padding:0">${steps.map((s,i)=>`<li class="${i<loading-1?"d":""}">${s}…</li>`).join("")}</ul><p class=mu style="margin:0">${img?"Reading your screenshot and ":""}checking Agent Memory…</p></div>`;
const n=code.split("\n").length,L=(t,l)=>l.length?l.map(esc).join("<br>"):"—";
return `<h1>Submit code for review</h1><p class=mu>Paste your code below${imgOK?", or upload / paste / drop a screenshot of it":""}. <span id=eng></span></p>${err?`<div class=card style="border-color:var(--cr);margin-bottom:12px;color:var(--cr)">${esc(err)}</div>`:""}
<div class="grid g2"><div><div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap"><select class=in style="width:auto" onchange="lang=this.value">${["Auto-detect","Python","JavaScript","TypeScript","Java","Go","C#"].map(l=>`<option ${l==lang?"selected":""}>${l}</option>`).join("")}</select>${imgOK?`<input type=file id=fi accept="${(imgLim.mediaTypes||["image/*"]).join(",")}" hidden onchange="pick(this.files[0])"><button class="btn g" onclick="$('#fi').click()">📷 Upload screenshot</button>`:""}<span style="flex:1"></span><button class="btn g" onclick="code='';img=null;imgUrl='';draw()">Clear</button><button class=btn onclick="run()">Review Code</button></div>
${!imgOK?`<div class=card style="padding:10px 14px;margin-bottom:10px;font-size:13px"><span class=wa>Screenshot input isn't available in this view.</span> <span class=mu>Paste the code as text below — or attach the screenshot in the Claude chat and ask for a review there.</span></div>`:""}${img?`<div class=card style="padding:8px;margin-bottom:10px;display:flex;gap:10px;align-items:center"><img src="${imgUrl}" style="height:60px;border-radius:6px"><span class=mu style="flex:1">Screenshot attached — the agent will read the code from the image.</span><button class="btn g" onclick="img=null;imgUrl='';draw()">Remove</button></div>`:""}
<div class=ed><div class=ln id=ln>${Array.from({length:n},(_,i)=>i+1).join("\n")}</div><div class=cw><pre id=hp>${hl(code)}\n</pre><textarea id=ta spellcheck=false placeholder="Paste your code here…" oninput="code=this.value;$('#hp').innerHTML=hl(code)+'\\n';$('#ln').textContent=Array.from({length:code.split('\\n').length},(_,i)=>i+1).join('\\n')" onscroll="$('#hp').scrollTop=this.scrollTop">${esc(code)}</textarea></div></div></div>
<div class=card><h2>Review Context</h2><span class=tag>TEAM RULES</span><p class=mu>${L(0,rules.filter(r=>r.e).slice(0,5).map(r=>r.t))}</p><span class=tag>PREVIOUS REVIEWS</span><p class=mu>${L(0,mem.filter(m=>m.type=="Previous Review").slice(0,3).map(m=>m.src+" — "+m.t))}</p><span class=tag>ARCHITECTURE DECISIONS</span><p class=mu style="margin:0">${L(0,mem.filter(m=>m.type=="Architecture Decision").slice(0,3).map(m=>m.t))}</p></div></div>`},
result(id){const r=revs.find(x=>x.id==id);if(!r)return `<h1>Review not found</h1>`;const R=r.res||DEMO,mi=R.issues.map(i=>i.memory_id==null?null:mem.find(m=>m.id==i.memory_id)).find(Boolean),sv=x=>["CRITICAL","WARNING","SUGGESTION"].includes(x)?x:"SUGGESTION";
return `<h1>Code Review Complete</h1><p><span class="tag ${R.status=="Approved"?"SUGGESTION":"WARNING"}">${esc(R.status.toUpperCase())}</span> <span class=mu>PR #${r.id} · ${esc(r.repo)} · ${esc(r.lang)} · ${R.issues.length} issues</span></p>
<div class=card style="margin:14px 0"><h2>Agent Activity</h2><div style="display:flex;gap:16px;flex-wrap:wrap" class=ok>${steps.map(s=>`<span>${s} ✓</span>`).join("")}</div>${R.summary?`<p class=mu style="margin:12px 0 0">${esc(R.summary)}</p>`:""}</div>
${mi?`<div class=mm><div><span class=tag style="background:#38d39f22;color:var(--ok)">◉ MEMORY MATCH FOUND</span><h2 style="margin:12px 0 4px;font-size:20px">${esc(mi.type)}: ${esc(mi.src)} — ${esc(mi.t)}</h2><span class=mu>Previous Team Decision:</span><div class=q>"${esc(mi.d)}"</div><p class=mu style="margin:0">CodeMind found a similar issue in your team's previous review history. This memory has been used ${mi.use} times.</p></div></div>`:`<div class=card style="margin-bottom:14px;border-style:dashed"><span class=tag>NO MEMORY MATCH</span> <span class=mu>Nothing in Agent Memory relates to these findings. Save the decision so the agent learns it.</span></div>`}
${R.issues.map(i=>issue(sv(i.severity),esc(i.title),i.line,i.snippet||"",esc(i.why),esc(i.fix))).join("")||"<div class=card>No issues found. Nice work.</div>"}
<div style="display:flex;gap:8px;flex-wrap:wrap"><button class=btn onclick="fix(${r.id})">Apply Suggested Fix</button><button class="btn g" onclick="toast('Issue dismissed')">Dismiss</button><button class=btn ${r.saved?"disabled style=opacity:.5":""} onclick="save(${r.id})">${r.saved?"Decision Saved ✓":"Save Decision"}</button><button class="btn g" onclick="location.hash='#/review'">Back to Review</button></div>`},
memory(){const l=tab=="All Memory"?mem:mem.filter(m=>m.type+"s"==tab||m.type==tab||(tab=="Common Mistakes"&&m.type=="Common Mistake")||(tab=="Previous Reviews"&&m.type=="Previous Review")||(tab=="Team Rules"&&m.type=="Team Rule")||(tab=="Architecture Decisions"&&m.type=="Architecture Decision"));
return `<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><h1>Agent Memory</h1><span class=mu>Knowledge CodeMind has learned from your team's reviews.</span></div><button class=btn onclick="modal=1;draw()">+ Add Memory</button></div>
<div class=tabs>${["All Memory","Team Rules","Previous Reviews","Architecture Decisions","Common Mistakes"].map(t=>`<button class="${t==tab?"on":""}" onclick="tab='${t}';draw()">${t}</button>`).join("")}</div><div class="grid g3">${l.map(memCard).join("")||"<p class=mu>Nothing here yet.</p>"}</div>`},
rules(){return `<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><h1>Team Coding Standards</h1><button class=btn onclick="const t=prompt('New team rule');if(t){rules.push({id:Date.now(),t,e:1});draw()}">+ Add Team Rule</button></div><div class=card style="margin-top:14px">${rules.map(r=>`<div class=row><span><span class=ok>✓</span> ${r.t}</span><span style="display:flex;gap:10px;align-items:center"><button class="sw ${r.e?"on":""}" onclick="tg(${r.id})"></button><a href=# class=mu onclick="ed(${r.id});return false">Edit</a><a href=# style="color:var(--cr)" onclick="rules=rules.filter(x=>x.id!=${r.id});draw();return false">Delete</a></span></div>`).join("")}</div>`},
history(){return `<h1>Review History</h1><input class=in style="max-width:320px;margin:12px 0" placeholder="Search reviews…" oninput="q=this.value;draw();$('#hs').focus()" id=hs value="${q}"><div class="card tw"><table><tr><th>Review ID<th>Repository<th>Language<th>Issues<th>Status<th>Date</tr>${revs.filter(r=>(r.repo+r.lang+r.st+r.id).toLowerCase().includes(q.toLowerCase())).map(r=>`<tr class=cl onclick="location.hash='#/review/${r.id}'"><td>PR #${r.id}<td>${r.repo}<td>${r.lang}<td>${r.n} issues<td class=${stC(r.st)}>${r.st}<td class=mu>${r.date}</tr>`).join("")}</table></div>`},
settings(){const f=(l,v)=>`<label>${l}</label><input class=in value="${v}">`,t=(l,o)=>`<div class=row><span>${l}</span><button class="sw ${o?"on":""}" onclick="this.classList.toggle('on')"></button></div>`;
return `<h1>Settings</h1><div class="grid g3" style="margin-top:14px"><div class=card><h2>Team</h2>${f("Team name","Platform Engineering")}${f("Repository","acme/backend-services")}<label>Default language</label><select class=in><option>Python</option><option>TypeScript</option></select></div><div class=card><h2>Review preferences</h2>${t("Block on critical issues",1)}${t("Suggest fixes inline",1)}${t("Strict mode",0)}<h2 style="margin-top:14px">Memory</h2>${t("Auto-save decisions",1)}${t("Use embeddings search",1)}${t("Notify on Memory Match",1)}</div></div>`}};
let q="";
function toast(t){const e=document.createElement("div");e.textContent=t;e.style.cssText="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ac);padding:10px 18px;border-radius:10px;z-index:30";document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}
function tg(id){const r=rules.find(x=>x.id==id);r.e=+!r.e;draw()}
function ed(id){const r=rules.find(x=>x.id==id),t=prompt("Edit rule",r.t);if(t){r.t=t;draw()}}
const DEMO={status:"Needs Changes",summary:"Sample review from team history.",issues:[{severity:"CRITICAL",title:"SQL Injection Risk",line:2,snippet:'query = "SELECT * FROM users WHERE id=" + user_id',why:"User-controlled input is inserted directly into a SQL query.",fix:"Use a parameterized query instead of string concatenation.",memory_id:0},{severity:"SUGGESTION",title:"Improve database abstraction",line:3,snippet:"return database.execute(query)",why:"Direct database calls are harder to test and reuse.",fix:"Move the query into a UserRepository function.",memory_id:null}],fixed_code:'def get_user(user_id):\n    query = "SELECT * FROM users WHERE id=%s"\n    return database.execute(query, (user_id,))\n',lesson:{type:"Previous Review",title:"Use parameterized SQL queries in submitted code",description:"Decision saved: SQL injection fixed per Memory Match with PR #18."}};
let imgOK=false,imgLim=null,SM=null,img=null,imgUrl="",lang="Auto-detect",err="";
window.claude&&claude.use("sample").then(s=>{SM=s;badge();return s.limits()}).then(l=>{imgLim=l&&l.images||null;imgOK=!!imgLim;if(onRev()&&!loading&&document.activeElement.id!="ta")draw()}).catch(()=>{badge()});
function badge(){const e=$("#eng");if(e)e.innerHTML=SM?'<span class=ok>● Claude AI review active</span>':'<span class=wa>● Offline heuristic mode — open in claude.ai for full AI review</span>'}
function pick(f){if(!f||!f.type.startsWith("image/"))return;if(!imgOK){toast("Screenshots aren't supported in this view. Paste the code as text.");return}if(imgLim.mediaTypes&&!imgLim.mediaTypes.includes(f.type)){toast("Use one of: "+imgLim.mediaTypes.join(", "));return}if(f.size>imgLim.maxInputBytes){toast("Image too large (max "+Math.round(imgLim.maxInputBytes/1048576)+" MB)");return}img=f;const r=new FileReader();r.onload=()=>{imgUrl=r.result;draw()};r.readAsDataURL(f)}
const onRev=()=>/^#\/review\/?$/.test(location.hash);
document.addEventListener("paste",e=>{if(onRev())pick([...(e.clipboardData?.files||[])].find(f=>f.type.startsWith("image/")))});
document.addEventListener("dragover",e=>e.preventDefault());
document.addEventListener("drop",e=>{e.preventDefault();if(onRev())pick(e.dataTransfer.files[0])});
function local(){if(img)throw new Error("Screenshot review needs Claude AI. Open this page in claude.ai, or paste the code as text.");const is=[];code.split("\n").forEach((l,i)=>{if(/\b(select|insert|update|delete)\b[^\n]*(\+|\$\{|\bf["'])/i.test(l))is.push({severity:"CRITICAL",title:"SQL Injection Risk",line:i+1,snippet:l.trim(),why:"User-controlled input is inserted directly into a SQL query.",fix:"Use a parameterized query instead of string concatenation.",memory_id:(mem.find(m=>/parameterized/i.test(m.t))||{}).id});if(/(api[_-]?key|secret|password|token)\s*[=:]\s*["'][^"']{6,}/i.test(l))is.push({severity:"CRITICAL",title:"Hard-coded credential",line:i+1,snippet:l.trim().slice(0,80),why:"Secrets in source code leak through version control.",fix:"Load the value from environment variables or a secrets manager.",memory_id:(mem.find(m=>/api keys/i.test(m.t))||{}).id})});return{language:lang,status:is.length?"Needs Changes":"Approved",summary:"Offline heuristic review (limited checks).",issues:is,fixed_code:"",lesson:is[0]?{type:"Previous Review",title:is[0].title+" fixed",description:is[0].fix}:null}}
async function analyze(){if(!SM)return local();
const ctx=mem.slice(0,40).map(m=>`${m.id}: [${m.type}] ${m.t} (${m.src})`).join("\n"),rl=rules.filter(r=>r.e).map(r=>"- "+r.t).join("\n");
const p=`You are CodeMind, a Code Review Agent with team memory. Review the code ${img?"in the attached screenshot (transcribe it exactly first)":"below"}. Language: ${lang}.
TEAM RULES:\n${rl}\nAGENT MEMORY (id: item):\n${ctx}\n${code.trim()?"CODE:\n"+code.slice(0,20000):""}
Find security, quality, performance and maintainability issues. When an issue relates to a memory item or team rule violation, set memory_id to that item's id (else null). Line numbers refer to the code.
Return ONLY JSON: {"language":"","code":"the code as text","status":"Needs Changes|Approved with Suggestions|Approved","summary":"one sentence","issues":[{"severity":"CRITICAL|WARNING|SUGGESTION","title":"","line":1,"snippet":"","why":"","fix":"","memory_id":null}],"fixed_code":"full corrected code","lesson":{"type":"Team Rule|Previous Review|Architecture Decision|Common Mistake","title":"short reusable decision","description":"one sentence"}}`;
return await SM.json(p,img?{images:img}:{})}
async function run(){if(!code.trim()&&!img){err="Paste some code or attach a screenshot first.";draw();return}
err="";loading=1;draw();const iv=setInterval(()=>{if(loading<steps.length){loading++;draw()}},900);
try{const R=await analyze();R.issues=(R.issues||[]).map(i=>({...i,severity:String(i.severity||"").toUpperCase()}));R.status=R.status||"Needs Changes";if(img&&R.code)code=R.code;
R.issues.forEach(i=>{const m=i.memory_id==null?null:mem.find(x=>x.id==i.memory_id);if(m)m.use++});
const id=Math.max(...revs.map(r=>r.id))+1;revs.unshift({id,repo:"Submitted code",lang:R.language||lang,n:R.issues.length,st:R.status,date:"Today",cr:R.issues.filter(i=>i.severity=="CRITICAL").length,res:R});clearInterval(iv);loading=0;location.hash="#/review/"+id}
catch(e){clearInterval(iv);loading=0;err=e.code=="not_granted"?"AI access was declined. Allow it to run reviews.":e.code=="rate_limited"?"Too many requests. Wait a moment and retry.":(e.message||"Review failed. Try again.");draw()}}
function fix(id){const r=revs.find(x=>x.id==id),f=(r.res||DEMO).fixed_code;if(!f){toast("No automatic fix available");return}code=f;img=null;imgUrl="";location.hash="#/review";toast("Fix applied to editor")}
function save(id){const r=revs.find(x=>x.id==id);if(!r||r.saved)return;const L=(r.res||DEMO).lesson||{type:"Previous Review",title:"Review of "+r.repo,description:"Decision saved from PR #"+id};mem.unshift({id:Date.now(),type:L.type,t:L.title,d:L.description,src:"PR #"+id,date:"Sep 28, 2026",use:1});r.saved=1;toast("Decision saved to Agent Memory");draw()}
function draw(){try{localStorage.setItem("cm2",JSON.stringify({mem,rules,revs}))}catch(e){}const h=location.hash.replace("#/","")||"dashboard",[p,id]=h.split("/");
$("#nav").innerHTML=NAV.map(n=>`<a href="#/${n[0]}" class="${n[0]==p?"on":""}"><span style="width:16px;text-align:center">${n[1]}</span>${n[2]}</a>`).join("");
$("#v").innerHTML=`<div class=pg>${p=="review"&&id?P.result(id):(P[p]||P.dashboard)()}</div>`;
$("#m").innerHTML=modal?`<div class=ov onclick="if(event.target==this){modal=null;draw()}"><div class=md><h2>Add Memory</h2><label>Memory type</label><select class=in id=mt>${MT.map(t=>`<option>${t}</option>`).join("")}</select><label>Title</label><input class=in id=mtl><label>Description</label><textarea class=in id=md rows=3></textarea><label>Source</label><input class=in id=ms placeholder="PR #45"><div style="text-align:right;margin-top:16px"><button class=btn onclick="const t=$('#mtl').value;if(!t)return;mem.unshift({id:Date.now(),type:$('#mt').value,t,d:$('#md').value||D[$('#mt').value],src:$('#ms').value||'Manual',date:'Sep 28, 2026',use:0});modal=null;draw()">Save Memory</button></div></div></div>`:""}
function go(){const a=document.activeElement.id;draw();window.scrollTo(0,0)}
try{const S=JSON.parse(localStorage.getItem("cm2")||"null");if(S){mem=S.mem;revs=S.revs;rules.splice(0,rules.length,...S.rules)}}catch(e){}
const _d=draw;draw=function(){_d();badge()};
addEventListener("hashchange",()=>{if(!loading){draw();scrollTo(0,0)}});draw();
</script></body></html>
